name: verify-with-manual

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install dependencies
        run: python3 -m pip install -U online-judge-verify-helper --break-system-packages

      - name: Run tests
        env:
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        run: oj-verify run

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: ninja -C build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
