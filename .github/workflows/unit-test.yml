name: unit-test

on:
  workflow_call:
    outputs:
      result:
        value: ${{ jobs.unit-test.outputs.result }}
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.unit-test.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        id: unit-test
        run: ctest --test-dir build --output-on-failure
